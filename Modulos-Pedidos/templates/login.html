{% load static %}
<!doctype html>

<!-- Representa la raíz de un documento HTML o XHTML. Todos los demás elementos deben ser descendientes de este elemento. -->
<html lang="es">
    
    <head>
        <title> Formulario de Acceso </title>
        <link href="https://fonts.googleapis.com/css?family=Nunito&display=swap" rel="stylesheet"> 
        
        <!-- Link hacia el archivo de estilos css -->
        <link rel="stylesheet" href="{% static 'assets_login/css/login.css' %}">
        
        <style type="text/css">
            
        </style>
        
        <script type="text/javascript">
        
        </script>
        
    </head>
    
    <body>
    
        <div id="contenedor">
            
            <div id="contenedorcentrado">
                <div id="login">
<form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <label for="username">Usuario:</label>
    <input id="usuario" type="text" name="login" placeholder="Usuario" required>


    <label for="password">Contraseña:</label>
    <input id="password" type="password" placeholder="Contraseña" name="password" required>

    <button type="submit">Iniciar sesión</button>
</form>

                </div>

                    <div class="titulo">
                        Bienvenido
                    </div>
                    <hr>
                    <div class="pie-form">
                        <a href="#">¿Perdiste tu contraseña?</a>
                        <a href="{% url 'register'  %}" >¿No tienes Cuenta? Registrate</a>
                        <hr>
                        <a href="{% url 'home' %}" class="btn btn-primary ml-xl-4">« Volver</a>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
</html>
